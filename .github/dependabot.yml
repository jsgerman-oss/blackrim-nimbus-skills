version: 2
updates:
  # GitHub Actions versions (including Raftersecurity/rafter-cli), grouped weekly.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
  # npm dependencies, grouped weekly so app deps get patched without a PR flood.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns:
          - "*"
