# Rafter secret-scan policy. Excludes lockfiles (integrity-hash false positives)
# and, because this is a skills-content pack, the instructional markdown: the
# cloud-provider SKILL and command docs are full of example keys and connection
# strings (AWS, Alibaba, Fly, Render, and so on) that are illustrative, not real.
# Application and config source stays scanned.
scan:
  exclude_paths:
    - "**/package-lock.json"
    - "**/pnpm-lock.yaml"
    - "**/yarn.lock"
    - "**/*.md"
